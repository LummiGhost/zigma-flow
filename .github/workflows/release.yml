name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Require tag and package versions to match
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e "if ('v'+require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Smoke check dist
        run: |
          node dist/cli.js --help
          node dist/cli.js contract-info --json
          test -f dist/templates/step-prompt.md
          test -f dist/templates/system-prompt.md

      - name: Build package archive
        # Older tags predate repository metadata required by npm OIDC.
        # Normalize only this metadata; the tagged runtime source is unchanged.
        run: |
          npm pkg set repository.type=git repository.url=git+https://github.com/LummiGhost/zigma-flow.git
          npm pack

      - name: Upload package archive
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Publish to npm with trusted publishing
        run: npm publish ./*.tgz --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" ./*.tgz --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
