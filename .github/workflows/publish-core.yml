name: Publish Core

# Core has no existing npm credential. Reuse the organization's existing
# release credential here without exporting it to another repository or host.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Core release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate tag syntax
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v6
        with:
          repository: LummiGhost/zigma-core
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require matching package and tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const p=require('./package.json'); if(p.name!=='@zigma-ai/zigma-core'||'v'+p.version!==process.env.RELEASE_TAG) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: core-npm-package
          path: '*.tgz'
          if-no-files-found: error
      - name: Publish Core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./*.tgz --access public
