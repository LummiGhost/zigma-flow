name: code-change-fast
version: 0.1.0

on:
  manual:

inputs:
  task:
    type: string
    required: true

skills:
  code:
    uses: skill://zigma.code-change@1

permissions:
  contents: read
  edits: write
  commands: none
  workflow_state: none

jobs:
  intake:
    steps:
      - id: analyze
        type: agent
        prompt: intake
        with:
          task: "${{ inputs.task }}"
        outputs:
          task_summary: {}
          scope: {}
          complexity_profile: {}
        expose:
          skills:
            - code

  implement:
    needs:
      - intake
    retry:
      max_attempts: 3
      on_exceeded:
        status: failed
    steps:
      - id: implement
        type: agent
        prompt: implement
        with:
          task: "${{ inputs.task }}"
        expose:
          skills:
            - code
      - id: collect-diff
        type: script
        run: "git diff HEAD"
        timeout: 300s
        env:
          CI: "true"
        on_failure: fail

  static-check:
    needs:
      - implement
    steps:
      - id: check
        type: script
        run: |
          PM=$(if [ -f pnpm-lock.yaml ]; then echo pnpm; elif [ -f yarn.lock ]; then echo yarn; elif [ -f package-lock.json ]; then echo npm; elif [ -f bun.lockb ] || [ -f bun.lock ]; then echo bun; else echo npm; fi)
          RUN="$PM"; if [ "$PM" = "npm" ] || [ "$PM" = "bun" ]; then RUN="$PM run"; fi
          $RUN typecheck && $RUN lint
        timeout: 600s
        env:
          CI: "true"
        on_failure: fail

  unit-test:
    needs:
      - implement
    steps:
      - id: test
        type: script
        run: |
          PM=$(if [ -f pnpm-lock.yaml ]; then echo pnpm; elif [ -f yarn.lock ]; then echo yarn; elif [ -f package-lock.json ]; then echo npm; elif [ -f bun.lockb ] || [ -f bun.lock ]; then echo bun; else echo npm; fi)
          RUN="$PM"; if [ "$PM" = "npm" ] || [ "$PM" = "bun" ]; then RUN="$PM run"; fi
          $RUN test:ci
        timeout: 600s
        env:
          CI: "true"
        on_failure: fail

  summarize:
    needs:
      - static-check
      - unit-test
    steps:
      - id: summarize
        type: agent
        prompt: summarize
        with:
          task: "${{ inputs.task }}"
        outputs:
          final_summary: {}
          remaining_risks: {}
          summary_artifact: {}
        expose:
          skills:
            - code
